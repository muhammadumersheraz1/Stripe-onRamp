<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout — Pay with card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://js.stripe.com/endive/stripe.js"></script>
    <script src="https://crypto-js.stripe.com/crypto-onramp-outer.js"></script>
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Checkout</span>
      </div>
      <div class="topbar-meta">
        <span class="badge live">Secure card payment</span>
      </div>
    </header>

    <main class="layout single">
      <section class="panel form-panel">
        <p class="eyebrow">Payment</p>
        <h1>Pay with card</h1>
        <p class="lede">
          Enter the amount and your email, then complete checkout in the secure
          payment widget below — no redirect.
        </p>

        <form id="onramp-form" class="form" novalidate>
          <label class="field">
            <span>Amount (USD)</span>
            <input
              id="source_amount"
              name="source_amount"
              type="number"
              min="1"
              step="1"
              value="50"
              required
            />
          </label>

          <label class="field">
            <span>Email</span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              value="muhammadumersheraz@gmail.com"
              required
            />
          </label>

          <div class="actions">
            <button type="submit" id="start-btn" class="btn primary">
              Continue to pay
            </button>
          </div>
        </form>

        <div id="error-box" class="error-box" hidden></div>
        <p id="session-status" class="session-status inline-status" hidden></p>

        <div id="onramp-panel" class="onramp-panel" hidden>
          <p class="result-title">Complete payment</p>
          <p class="hint-inline">
            Stay on this page — Stripe Onramp opens in the widget below.
          </p>
          <div id="onramp-element" class="onramp-element"></div>
        </div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
